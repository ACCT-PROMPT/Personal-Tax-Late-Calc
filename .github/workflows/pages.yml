name: Redirect legacy GitHub Pages URL to ACCT Prompt

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy account-portal redirect
    runs-on: ubuntu-latest
    steps:
      - name: Prepare redirect page
        run: |
          mkdir -p pages-redirect
          cat > pages-redirect/index.html <<'HTML'
          <!doctype html>
          <html lang="th">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <meta http-equiv="refresh" content="0;url=https://acctprompt.com/my-programs?open=personal-tax-late-calc">
              <title>เปิดโปรแกรมผ่าน ACCT Prompt</title>
              <script>location.replace('https://acctprompt.com/my-programs?open=personal-tax-late-calc');</script>
            </head>
            <body>
              <p>โปรแกรมนี้เปิดผ่านบัญชีสมาชิก ACCT Prompt</p>
              <p><a href="https://acctprompt.com/my-programs?open=personal-tax-late-calc">ไปที่โปรแกรมของฉัน</a></p>
            </body>
          </html>
          HTML
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload redirect artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - name: Deploy redirect
        id: deployment
        uses: actions/deploy-pages@v4

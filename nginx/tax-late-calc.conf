# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name tax-late-calc.acctprompt.com;
    return 301 https://$host$request_uri;
}

# เว็บ static (ผล build ของ Vite) เสิร์ฟตรงจาก nginx ไม่ต้องมี service แยก
server {
    listen 443 ssl;
    http2 on;
    server_name tax-late-calc.acctprompt.com;

    ssl_certificate      C:/nginx/ssl/cert.crt;
    ssl_certificate_key  C:/nginx/ssl/cert.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;

    root  C:/acctprompt-project/Apps/tax-late-calc;
    index index.html;

    # ไฟล์ใน /assets มีแฮชในชื่อ แคชได้นาน
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ฟอนต์ไม่มีแฮชในชื่อ แคช 30 วัน
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # หน้า HTML ห้ามแคช เพื่อให้เวอร์ชันใหม่ขึ้นทันทีหลัง deploy
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
